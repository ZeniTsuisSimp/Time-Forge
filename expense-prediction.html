<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Prediction - TimeForge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="prediction-form.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="content">
        <nav>
            <div class="logo">Time<span>Forge</span></div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">Home</a>
                <a href="predictions.html" class="nav-btn">Back</a>
            </div>
        </nav>

        <main class="form-container">
            <h1 class="glitch" data-text="Expense Prediction">Expense Prediction</h1>
            <form id="expenseForm" class="prediction-form">
                <div class="form-group">
                    <label for="incomeAmount">Monthly Income ($)</label>
                    <input type="number" id="incomeAmount" required min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label for="expenseCategories">Major Expense Categories</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="categories" value="housing"> Housing</label>
                        <label><input type="checkbox" name="categories" value="transportation"> Transportation</label>
                        <label><input type="checkbox" name="categories" value="food"> Food</label>
                        <label><input type="checkbox" name="categories" value="utilities"> Utilities</label>
                        <label><input type="checkbox" name="categories" value="entertainment"> Entertainment</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="predictionPeriod">Prediction Period</label>
                    <select id="predictionPeriod" required>
                        <option value="1m">1 Month</option>
                        <option value="3m">3 Months</option>
                        <option value="6m">6 Months</option>
                        <option value="1y">1 Year</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Generate Prediction</button>
            </form>
        </main>
    </div>
    <script type="module" src="prediction-form.js"></script>
</body>
</html>
