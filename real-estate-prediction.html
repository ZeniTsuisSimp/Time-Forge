<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Prediction - TimeForge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="prediction-form.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="content">
        <nav>
            <div class="logo">Time<span>Forge</span></div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">Home</a>
                <a href="predictions.html" class="nav-btn">Back</a>
            </div>
        </nav>

        <main class="form-container">
            <h1 class="glitch" data-text="Real Estate Prediction">Real Estate Prediction</h1>
            <form id="realEstateForm" class="prediction-form">
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" required placeholder="City, State">
                </div>
                <div class="form-group">
                    <label for="propertyType">Property Type</label>
                    <select id="propertyType" required>
                        <option value="residential">Residential</option>
                        <option value="commercial">Commercial</option>
                        <option value="industrial">Industrial</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="propertySize">Property Size (sq ft)</label>
                    <input type="number" id="propertySize" required min="0">
                </div>
                <div class="form-group">
                    <label for="predictionPeriod">Prediction Period</label>
                    <select id="predictionPeriod" required>
                        <option value="1y">1 Year</option>
                        <option value="5y">5 Years</option>
                        <option value="10y">10 Years</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Generate Prediction</button>
            </form>
        </main>
    </div>
    <script type="module" src="prediction-form.js"></script>
</body>
</html>
